name: ImageKit Upload Test

on:
  push:
    paths:
      - '.github/workflows/imagekit-upload-test.yml'
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret exists
        env:
          IMAGEKIT_KEY: ${{ secrets.AIVAULT_Backend }}
        run: |
          if [ -z "$IMAGEKIT_KEY" ]; then
            echo "AIVAULT_Backend secret is missing"
            exit 1
          fi

      - name: Create tiny MP4 without ffmpeg
        run: |
          python3 - <<'PY'
          import base64
          # Minimal ISO-BMFF/MP4 test payload. Enough for upload/auth verification.
          data = base64.b64decode('AAAAHGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAARtZGF0')
          open('/tmp/aivault-imagekit-test.mp4','wb').write(data)
          print('created bytes:', len(data))
          PY

      - name: Upload test video to ImageKit
        env:
          IMAGEKIT_KEY: ${{ secrets.AIVAULT_Backend }}
        run: |
          HTTP=$(curl -sS -o /tmp/imagekit-response.json -w '%{http_code}' \
            -X POST 'https://upload.imagekit.io/api/v1/files/upload' \
            -u "$IMAGEKIT_KEY:" \
            -F 'file=@/tmp/aivault-imagekit-test.mp4;type=video/mp4' \
            -F 'fileName=aivault-imagekit-test.mp4' \
            -F 'folder=/dawn-second-base/tests')
          echo "ImageKit HTTP status: $HTTP"
          python3 - <<'PY'
          import json
          p='/tmp/imagekit-response.json'
          try:
              d=json.load(open(p))
              safe={k:d.get(k) for k in ('fileId','name','url','filePath','size') if k in d}
              if 'message' in d: safe['message']=d['message']
              print(json.dumps(safe, ensure_ascii=False))
          except Exception:
              print(open(p, errors='replace').read()[:1000])
          PY
          test "$HTTP" -ge 200 -a "$HTTP" -lt 300
